[workspace]
resolver = "2"
members = [
    "apps/fhdc-desktop",
    "crates/fhdc-domain",
    "crates/fhdc-hdc",
    "crates/fhdc-fake",
    "crates/fhdc-device",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
fhdc-domain = { path = "crates/fhdc-domain" }
fhdc-hdc = { path = "crates/fhdc-hdc" }
fhdc-fake = { path = "crates/fhdc-fake" }
fhdc-device = { path = "crates/fhdc-device" }
async-trait = "0.1.91"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# egui 在无优化的 debug 下帧率很差;依赖统一开 O2,自身保留快速编译。
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
